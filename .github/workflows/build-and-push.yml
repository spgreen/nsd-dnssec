name: Build and publish NSD image

# Automates the manual process from the ops runbook: bump NSD_VERSION /
# SHA256_HASH in the Dockerfile, build, smoke-test, and push. The image tag
# is read directly from the Dockerfile's ARG NSD_VERSION rather than typed
# in separately (as a git tag would require), so it can't drift from what
# the image actually contains.
#
# Triggers on any push to master that touches the Dockerfile, and on pull
# requests that touch it (build + smoke-test only, no push - secrets aren't
# available to fork PRs anyway). workflow_dispatch allows a manual re-run,
# e.g. to retry a push after a registry outage without an empty commit.

on:
  push:
    branches: [ master ]
    paths:
      - 'Dockerfile'
  pull_request:
    paths:
      - 'Dockerfile'
  workflow_dispatch: {}

env:
  IMAGE: docker.io/spgreen/nsd-dnssec

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract NSD_VERSION from Dockerfile
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP '^ARG\s+NSD_VERSION=\K[0-9][0-9A-Za-z.\-]*' Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find an 'ARG NSD_VERSION=...' line in Dockerfile"
            exit 1
          fi
          echo "Detected NSD_VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, not pushed yet)
        run: |
          docker buildx build \
            --load \
            -t "${IMAGE}:${{ steps.version.outputs.version }}" \
            .

      - name: Smoke-test the image
        # Confirms the DNSSEC helper scripts this fleet depends on
        # (see the ops runbook's container-operations section) are actually
        # present and on PATH, without needing zone/config volumes mounted.
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:${{ steps.version.outputs.version }}" \
            -c "which nsd signzone keygen ds-records nsd-checkzone nsd-control"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${IMAGE}:${{ steps.version.outputs.version }}" "${IMAGE}:latest"
          docker push "${IMAGE}:${{ steps.version.outputs.version }}"
          docker push "${IMAGE}:latest"
